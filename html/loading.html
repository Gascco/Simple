<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cargando - Simple Market Saludable</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../CSS/loading.css">
</head>
<body>

    <div class="loading-container d-flex flex-column justify-content-center align-items-center">
        <div class="brand-logo-container mb-4">
            <img src="../Img/LogoN.png" alt="Simple Market Saludable" class="brand-logo img-fluid">
        </div>

        <div class="custom-spinner" role="status">
            <span class="visually-hidden">Cargando...</span>
        </div>
    </div>


    <script>
        const destination = new URLSearchParams(window.location.search).get('dest');
        const allowedDestinations = {
            roles: '/roles.html',
            caja: '/caja.html',
            cocina: '/cocina.html'
        };
        setTimeout(() => {
            window.location.replace(allowedDestinations[destination] || allowedDestinations.roles);
        }, 3000);
    </script>

</body>
</html>
