<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Selección de Área - Simple Market Saludable</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../CSS/roles.css">
</head>
<body class="d-flex flex-column justify-content-between min-vh-100 p-4">

    <header class="text-center pt-3">
        <img src="../Img/LogoN.png" alt="Simple Market Saludable" class="brand-logo img-fluid">
    </header>

    <main class="container text-center my-auto">
        <h2 class="welcome-title fw-bold mb-2">¡Hola, Juan!</h2>
        <p class="welcome-subtitle  mb-5">Por favor, selecciona tu área de trabajo:</p>

        <div class="row justify-content-center align-items-center g-4 g-md-5">
            <div class="col-12 col-sm-6 col-md-5 col-lg-4">
                <a href="/loading.html?dest=caja" class="role-card d-flex flex-column align-items-center justify-content-center text-decoration-none">
                    <div class="role-icon-circle d-flex flex-column align-items-center justify-content-center">
                        <img src="../Img/Caja.png" alt="Caja" class="role-icon img-fluid mb-2">
                        <span class="role-label fw-bold">Caja</span>
                    </div>
                </a>
            </div>

            <div class="col-12 col-sm-6 col-md-5 col-lg-4">
                <a href="/loading.html?dest=cocina" class="role-card d-flex flex-column align-items-center justify-content-center text-decoration-none">
                    <div class="role-icon-circle d-flex flex-column align-items-center justify-content-center">
                        <img src="../Img/Cocina.png" alt="Cocina" class="role-icon img-fluid mb-2">
                        <span class="role-label fw-bold">Cocina</span>
                    </div>
                </a>
            </div>
        </div>
    </main>

   <footer class="d-flex flex-column flex-sm-row justify-content-between align-items-center pt-3 gap-3">
        <div class="active-session d-flex align-items-center">
            <span class="session-dot me-2"></span>
            <span class="session-text">Sesion activa: Juan Perez (juan@simple.pe)</span>
        </div>
        <a href="login.html" class="btn btn-logout px-4 py-2">Cerrar sesión</a>
    </footer>

<script src="/js/shared.js"></script>
</body>
</html>
